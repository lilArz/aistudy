{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
    if (localStorage.getItem('dark') === '1') {
        document.documentElement.classList.add('dark');
        document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('dark');
        });
    }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PyLearn{% endblock %}</title>
    <link href="{% static 'bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'bootstrap/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AiStudy">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'catalog' %}">
            <i class="bi bi-code-slash"></i> PyLearn
        </a>
    </div>
</nav>

<main class="container my-4">
    {% block content %}{% endblock %}
</main>

<nav class="mobile-nav d-flex">
    <a href="{% url 'my_courses' %}" class="mobile-nav-item">
        <span>🏠</span>
        <span>Обучение</span>
    </a>
    <a href="{% url 'catalog' %}" class="mobile-nav-item">
        <span>🔍</span>
        <span>Каталог</span>
    </a>
    {% if user.is_authenticated %}
    <a href="{% url 'cart' %}" class="mobile-nav-item">
        <span>🛒</span>
        <span>Корзина</span>
    </a>
    <a href="{% url 'profile' %}" class="mobile-nav-item">
        <span>👤</span>
        <span>Профиль</span>
    </a>
    {% else %}
    <a href="{% url 'login' %}" class="mobile-nav-item">
        <span>👤</span>
        <span>Войти</span>
    </a>
    {% endif %}
</nav>

<script src="{% static 'bootstrap/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
